<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#123ea9"><link rel="stylesheet" href="style.css"><script src="firebase-config.js"></script><script src="data.js"></script><title>Devindra Mart Customer</title><script src="app.js" defer></script></head><body><div class="appShell"><header class='topbar'><div class='brand'><div class='logo'>DM</div><div><b>Devindra Mart</b><small>Wholesale & Retail</small></div></div><div class='headerSearch'><span>🔎</span><input id='globalSearch' placeholder='Search items...' oninput='renderProducts&&renderProducts()'><button class='secondary' onclick="toast('Voice search hook')">🎤</button></div><div class='headerIcon'>🔔<span class='dot'>3</span></div><div class='headerIcon'>🌐</div></header><main class="page"><section id="loginScreen" class="card"><h1>Welcome Back</h1><input id="phone" value="7678256489"><button onclick="login()">Verify & Continue</button></section><section id="addressScreen" class="card hidden"><h2>Delivery Address</h2><input id="profileName" placeholder="Full Name"><input id="profilePhone" disabled><textarea id="profileAddress" placeholder="Full address"></textarea><select id="area"><option>Warisnagar</option><option>Samastipur</option><option>Gurgaon</option></select><select id="mode"><option value="both">Both</option><option value="wholesale">Wholesale</option><option value="retail">Retail</option></select><button onclick="saveAddress()">Save & Open App</button></section><section id="mainApp" class="hidden"><div id="tab-home" class="tabPanel"><section class="hero"><div><span class="badge gold">Launch Mode</span><h1>Daily Essentials</h1><p>Real product images, variant dropdown aur wholesale pricing.</p><button>Shop Now</button></div><div class="heroImg">🛒</div></section><div class="quickGrid"><button class="quickBtn" onclick="setTab('shop')">🏪 Shop</button><button class="quickBtn" onclick="setTab('cart')">🛒 Cart</button><button class="quickBtn" onclick="setTab('khata')">📒 Khata</button><button class="quickBtn" onclick="toast('Voice order hook')">🎤 Voice</button></div><div id="homeStats" class="grid"></div><div class="sectionHead"><h2>Best Sellers</h2><span class="badge">Excel 1540</span></div><input id="search" placeholder="Search product/category" oninput="renderProducts()"><div id="products" class="grid"></div></div><div id="tab-shop" class="tabPanel"><h2>Shop & Category</h2><div class="chips" id="catBtns"></div><div id="shopBox" class="grid"></div></div><div id="tab-cart" class="tabPanel"><section class="card"><h2>Cart & Checkout</h2><div id="cartList"></div><p id="cartBill"></p><select id="pay"></select><button class="green" onclick="placeOrder()">Place Order + WhatsApp</button></section><section class="card"><h2>Parcha Upload</h2><input id="parchaFile" type="file" accept="image/*"><button onclick="parcha()">Upload Parcha</button></section><section class="card"><h2>My Orders</h2><div id="orderList"></div></section></div><div id="tab-khata" class="tabPanel"><h2>Mera Khata</h2><div id="khataBox"></div></div><div id="tab-profile" class="tabPanel"><h2>Profile</h2><div class="card" id="profileBox"></div></div></section></main><nav class="bottomTabs customer"><button data-tab="home" onclick="setTab('home')">🏠<span>Home</span></button><button data-tab="shop" onclick="setTab('shop')">🏪<span>Shop Cat.</span></button><button data-tab="cart" onclick="setTab('cart')">🛒<span>Cart</span></button><button id="khataTabBtn" data-tab="khata" onclick="setTab('khata')">📒<span>Khata</span></button><button data-tab="profile" onclick="setTab('profile')">👤<span>Profile</span></button></nav></div><script src="/pwa-install.js"></script></body></html>
